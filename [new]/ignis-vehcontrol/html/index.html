<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Control</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div id="vehicle-control">
        <div class="control-panel">
            <!-- Header -->
            <div class="panel-header">
                <div class="header-content">
                    <div class="header-icon">
                        <i class="fas fa-car"></i>
                    </div>
                    <div class="header-info">
                        <div class="header-title" id="vehicle-plate">ABC 123</div>
                        <div class="header-subtitle" id="vehicle-occupancy">2/4 SEATS</div>
                    </div>
                </div>
                <div class="header-accent"></div>
            </div>
            
            <!-- Seat switching section -->
            <div class="seat-section">
                <div class="section-title">SEAT SWITCHING</div>
                <div class="seat-grid">
                    <div class="seat-box" data-seat="-1">
                        <div class="seat-content">
                            <div class="seat-icon">
                                <i class="fas fa-user"></i>
                            </div>
                            <div class="seat-label">DRIVER</div>
                            <div class="seat-status"></div>
                        </div>
                    </div>
                    
                    <div class="seat-box" data-seat="0">
                        <div class="seat-content">
                            <div class="seat-icon">
                                <i class="fas fa-user"></i>
                            </div>
                            <div class="seat-label">FRONT</div>
                            <div class="seat-status"></div>
                        </div>
                    </div>
                    
                    <div class="seat-box" data-seat="1">
                        <div class="seat-content">
                            <div class="seat-icon">
                                <i class="fas fa-user"></i>
                            </div>
                            <div class="seat-label">REAR L</div>
                            <div class="seat-status"></div>
                        </div>
                    </div>
                    
                    <div class="seat-box" data-seat="2">
                        <div class="seat-content">
                            <div class="seat-icon">
                                <i class="fas fa-user"></i>
                            </div>
                            <div class="seat-label">REAR R</div>
                            <div class="seat-status"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Main control grid -->
            <div class="control-section">
                <div class="section-title">VEHICLE CONTROLS</div>
                <div class="control-grid">
                    <!-- Row 1 - Front doors and hood -->
                    <div class="control-box door-control" data-door="0">
                        <div class="box-content">
                            <div class="box-icon">
                                <i class="fas fa-door-open"></i>
                            </div>
                            <div class="box-info">
                                <div class="box-label">FRONT</div>
                                <div class="box-sublabel">LEFT</div>
                            </div>
                            <div class="status-indicator"></div>
                        </div>
                    </div>
                    
                    <div class="control-box special-control" data-door="4">
                        <div class="box-content">
                            <div class="box-icon">
                                <i class="fas fa-car-battery"></i>
                            </div>
                            <div class="box-info">
                                <div class="box-label">ENGINE</div>
                                <div class="box-sublabel">HOOD</div>
                            </div>
                            <div class="status-indicator"></div>
                        </div>
                    </div>
                    
                    <div class="control-box door-control" data-door="1">
                        <div class="box-content">
                            <div class="box-icon">
                                <i class="fas fa-door-open"></i>
                            </div>
                            <div class="box-info">
                                <div class="box-label">FRONT</div>
                                <div class="box-sublabel">RIGHT</div>
                            </div>
                            <div class="status-indicator"></div>
                        </div>
                    </div>
                    
                    <!-- Row 2 - Windows front -->
                    <div class="control-box window-control" data-window="0">
                        <div class="box-content">
                            <div class="box-icon">
                                <i class="fas fa-window-maximize"></i>
                            </div>
                            <div class="box-info">
                                <div class="box-label">WINDOW</div>
                                <div class="box-sublabel">FL</div>
                            </div>
                            <div class="status-indicator"></div>
                        </div>
                    </div>
                    
                    <div class="control-box primary-control" id="engine-control">
                        <div class="box-content">
                            <div class="box-icon">
                                <i class="fas fa-power-off"></i>
                            </div>
                            <div class="box-info">
                                <div class="box-label">ENGINE</div>
                                <div class="box-sublabel">POWER</div>
                            </div>
                            <div class="status-indicator"></div>
                        </div>
                    </div>
                    
                    <div class="control-box window-control" data-window="1">
                        <div class="box-content">
                            <div class="box-icon">
                                <i class="fas fa-window-maximize"></i>
                            </div>
                            <div class="box-info">
                                <div class="box-label">WINDOW</div>
                                <div class="box-sublabel">FR</div>
                            </div>
                            <div class="status-indicator"></div>
                        </div>
                    </div>
                    
                    <!-- Row 3 - Windows rear -->
                    <div class="control-box window-control" data-window="2">
                        <div class="box-content">
                            <div class="box-icon">
                                <i class="fas fa-window-maximize"></i>
                            </div>
                            <div class="box-info">
                                <div class="box-label">WINDOW</div>
                                <div class="box-sublabel">RL</div>
                            </div>
                            <div class="status-indicator"></div>
                        </div>
                    </div>
                    
                    <div class="control-box secondary-control" id="lights-control">
                        <div class="box-content">
                            <div class="box-icon">
                                <i class="fas fa-lightbulb"></i>
                            </div>
                            <div class="box-info">
                                <div class="box-label">INTERIOR</div>
                                <div class="box-sublabel">LIGHTS</div>
                            </div>
                            <div class="status-indicator"></div>
                        </div>
                    </div>
                    
                    <div class="control-box window-control" data-window="3">
                        <div class="box-content">
                            <div class="box-icon">
                                <i class="fas fa-window-maximize"></i>
                            </div>
                            <div class="box-info">
                                <div class="box-label">WINDOW</div>
                                <div class="box-sublabel">RR</div>
                            </div>
                            <div class="status-indicator"></div>
                        </div>
                    </div>
                    
                    <!-- Row 4 - Rear doors and trunk -->
                    <div class="control-box door-control" data-door="2">
                        <div class="box-content">
                            <div class="box-icon">
                                <i class="fas fa-door-open"></i>
                            </div>
                            <div class="box-info">
                                <div class="box-label">REAR</div>
                                <div class="box-sublabel">LEFT</div>
                            </div>
                            <div class="status-indicator"></div>
                        </div>
                    </div>
                    
                    <div class="control-box special-control" data-door="5">
                        <div class="box-content">
                            <div class="box-icon">
                                <i class="fas fa-suitcase"></i>
                            </div>
                            <div class="box-info">
                                <div class="box-label">TRUNK</div>
                                <div class="box-sublabel">CARGO</div>
                            </div>
                            <div class="status-indicator"></div>
                        </div>
                    </div>
                    
                    <div class="control-box door-control" data-door="3">
                        <div class="box-content">
                            <div class="box-icon">
                                <i class="fas fa-door-open"></i>
                            </div>
                            <div class="box-info">
                                <div class="box-label">REAR</div>
                                <div class="box-sublabel">RIGHT</div>
                            </div>
                            <div class="status-indicator"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Status section -->
            <div class="status-section">
                <div class="status-container">
                    <div class="status-box health">
                        <div class="status-header">
                            <div class="status-icon">
                                <i class="fas fa-heart-pulse"></i>
                            </div>
                            <div class="status-text">
                                <div class="status-label">VEHICLE HEALTH</div>
                                <div class="status-value" id="health-value">100%</div>
                            </div>
                        </div>
                        <div class="status-progress">
                            <div class="progress-track">
                                <div class="progress-fill health-fill" id="health-bar"></div>
                                <div class="progress-glow health-glow" id="health-glow"></div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="status-box fuel">
                        <div class="status-header">
                            <div class="status-icon">
                                <i class="fas fa-gas-pump"></i>
                            </div>
                            <div class="status-text">
                                <div class="status-label">FUEL LEVEL</div>
                                <div class="status-value" id="fuel-value">100%</div>
                            </div>
                        </div>
                        <div class="status-progress">
                            <div class="progress-track">
                                <div class="progress-fill fuel-fill" id="fuel-bar"></div>
                                <div class="progress-glow fuel-glow" id="fuel-glow"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Footer -->
            <div class="panel-footer">
                <div class="footer-info">
                    <span class="footer-text">ESC to close</span>
                    <span class="footer-version" id="vehicle-model">UNKNOWN</span>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
